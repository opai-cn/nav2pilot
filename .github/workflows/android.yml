name: Android build

on:
  # Manual only: releases are built and published from the Mac with scripts/build-release.sh,
  # which pushes the tag v<version>. Pushing a tag must not start a build here.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (MAJOR.MINOR.PATCH, without v)'
        required: true
        default: '0.1.0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the checksum of gradle/wrapper/gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The build is pinned to compileSdk 36 and AGP 8.13's default build-tools (README "Toolchain").
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      # Signing key is committed to the repo in .signing/nav2pilot-release.keystore.
      - name: Unit tests, lint, signed release APK
        env:
          ANDROID_KEYSTORE_PATH: .signing/nav2pilot-release.keystore
          ANDROID_KEYSTORE_PASSWORD: 52x9z6oc4nfmgetblwjd
          ANDROID_KEY_ALIAS: nav2pilot
          ANDROID_KEY_PASSWORD: 52x9z6oc4nfmgetblwjd
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease assembleDebugAndroidTest -PreleaseVersion="${{ inputs.version }}"

      - name: Verify APK signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk'

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav2pilot-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
